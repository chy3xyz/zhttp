name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: master

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libngtcp2-dev libnghttp3-dev

      - name: Run Tests
        run: zig build test

      - name: Build Examples
        run: zig build

      # HTTP/3 is opt-in, so it needs its own pass to stay covered.
      - name: Run Tests and Build with HTTP/3
        run: |
          zig build test -Dh3=true
          zig build -Dh3=true
